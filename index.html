<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PHP Words</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header class="cabecera">
    <div class="contenedor-cabecera">
      <h1 id="titulo"></h1>
      <p id="subtitulo"></p>
      <span id="version"></span>
    </div>
  </header>

  <main class="contenedor-principal">
    <!-- Las etiquetas accesibles identifican los filtros, el estado y los resultados a tecnologías de asistencia. -->
    <div id="controles" role="search" aria-label="Buscar y filtrar palabras"></div>
    <div id="contador" role="status" aria-live="polite" aria-atomic="true"></div>
    <ul id="lista" aria-label="Palabras de PHP"></ul>
  </main>

  <script src="js/config.js"></script>
  <script src="js/palabras.js"></script>
  <script src="js/app.js"></script>
  <script src="js/buscador.js"></script>
  <script src="js/categorias.js"></script>
</body>
</html>
